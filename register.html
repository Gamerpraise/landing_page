<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Register – BusyHands Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2718%27 fill=%27%23e0457b%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2716%27 fill=%27%23fff%27/%3E%3C/svg%3E" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<section class="center">
  <div class="card login-card">
    <svg class="lg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a9c"/><stop offset="1" stop-color="#c9285d"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lgg)"/><circle cx="32" cy="32" r="16" fill="#fff"/><path d="M19 28q13 8 26 0M18 35q14 8 28 0M23 21q9 14 18 22M41 21q-9 14-18 22" stroke="#c9285d" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <h1>Create admin account</h1>
    <p class="muted">Only the shop owner's email can register.</p>
    <form id="regForm" autocomplete="on">
      <label>Email <input id="rEmail" type="email" autocomplete="username" required></label>
      <label>Password <input id="rPass" type="password" autocomplete="new-password" required minlength="8"></label>
      <label>Confirm password <input id="rPass2" type="password" autocomplete="new-password" required minlength="8"></label>
      <button class="btn" id="regBtn" type="submit">Register</button>
    </form>
    <p class="err" id="regErr" role="alert"></p>
    <p class="ok" id="regOk" role="status"></p>
    <p class="small muted">Already registered? <a class="lnk" href="admin.html">Sign in</a> &nbsp;·&nbsp; <a class="lnk" href="index.html">Back to shop</a></p>
  </div>
</section>
<script type="module" src="register.js"></script>
</body>
</html>
